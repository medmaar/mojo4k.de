name: Verify live invoices never email clients

# Read-only: downloads the code each live trial Worker is running and runs its invoice handler for paid
# orders at many hours and prices with a fake Resend. Never sends an email. Passes only if no client
# would ever get an invoice email. Also shows mojo4k.uk's latest Pages deployments.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download live Worker code
        run: |
          mkdir -p live
          for W in maple4k maplehd maplestreamtv iptvmapletv iptvmojo mojo4ktv buyiptvnorway norgesiptv flimmerkanal iptvvde mojo4kde streamdeutschland mojo4kfr streambleu; do
            curl -sS -m 30 "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-$W/content/v2" -H "Authorization: Bearer ${CF_TOKEN}" -o live/iptv-trial-$W.js
            echo "iptv-trial-$W | bytes=$(wc -c < live/iptv-trial-$W.js) | notify_owner=$(grep -c 'INVOICE_MODE = "notify_owner"' live/iptv-trial-$W.js || true) | client send lines=$(grep -c 'T().subject, invoiceEmail(' live/iptv-trial-$W.js || true)"
          done
      - name: Test paid orders on the live code
        run: node scripts/no-client-invoice-test.mjs live
      - name: mojo4k.uk recent Pages deployments
        if: always()
        run: |
          curl -sS -m 30 "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/mojo4k-uk/deployments" -H "Authorization: Bearer ${CF_TOKEN}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success'), d.get('errors')); [print(x.get('created_on'), x.get('environment'), (x.get('deployment_trigger') or {}).get('metadata',{}).get('commit_hash','')[:7], [(s.get('name'), s.get('status')) for s in x.get('stages') or []]) for x in (d.get('result') or [])[:4]]"
