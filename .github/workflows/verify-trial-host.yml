name: Verify live trial server host

# Read-only: downloads the code each live trial Worker is running and checks
# which server host its trial emails use. Also shows mojo4k.uk's latest Pages
# deployment. Never creates a trial or sends an email.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Live Worker code
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}"
          FAIL=0
          for W in iptv-trial-maple4k iptv-trial-maplehd iptv-trial-maplestreamtv iptv-trial-iptvmapletv iptv-trial-iptvmojo iptv-trial-mojo4ktv iptv-trial-buyiptvnorway iptv-trial-norgesiptv iptv-trial-flimmerkanal iptv-trial-iptvvde iptv-trial-mojo4kde iptv-trial-streamdeutschland iptv-trial-mojo4kfr iptv-trial-streambleu; do
            curl -sS -m 30 "$API/workers/scripts/$W/content/v2" -H "Authorization: Bearer ${CF_TOKEN}" -o code.js
            NEW=$(grep -c 'line.truthdaily.me' code.js || true)
            OLD=$(grep -c 'fanjerseysonline' code.js || true)
            HOSTLINE=$(grep -oE '(const (HOST|PANEL_HOST) *= *"[^"]*")' code.js | head -1)
            M3U=$(grep -c 'const h = EMAIL_BRAND.host' code.js || true)
            echo "$W | bytes=$(wc -c < code.js) | $HOSTLINE | truthdaily=$NEW | fanjerseysonline=$OLD | new-m3u-rewrite=$M3U"
            if [ "$NEW" = 0 ] || [ "$OLD" != 0 ]; then FAIL=1; fi
          done
          exit $FAIL
      - name: mojo4k.uk Pages deployment and server override
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects"
          curl -sS -m 30 "$API?per_page=50" -H "Authorization: Bearer ${CF_TOKEN}" > projects.json
          python3 - <<'PY'
          import json
          d = json.load(open("projects.json"))
          print("success:", d.get("success"), d.get("errors"))
          for p in d.get("result") or []:
              doms = p.get("domains") or []
              if not any("mojo4k.uk" in x for x in doms): continue
              print("project:", p.get("name"), doms)
              lp = p.get("latest_deployment") or {}
              print("latest:", lp.get("created_on"), (lp.get("deployment_trigger") or {}).get("metadata", {}).get("commit_hash", "")[:7], (lp.get("latest_stage") or {}).get("name"), (lp.get("latest_stage") or {}).get("status"))
              ev = (p.get("deployment_configs") or {}).get("production", {}).get("env_vars") or {}
              hit = [k for k in ev if k.startswith("TRIAL_SERVER")]
              for k in hit: print(" ", k, "=", ev[k].get("value") if ev[k].get("type") == "plain_text" else "(secret)")
              if not hit: print("  no TRIAL_SERVER_URL override")
          PY
