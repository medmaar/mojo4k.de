name: Trial Worker Health Check

# Read-only check of the live free-trial worker. It never creates a trial line
# and never sends an email: it only reads the worker's status, the panel's
# reseller info and the names (not values) of the worker's secrets.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/trial-health.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Worker responds
        run: |
          curl -sS -m 20 -w "\nHTTP %{http_code}\n" "https://iptv-trial-mojo4kde.medmaar.workers.dev/"

      - name: Site allows the form to reach the worker (CSP)
        run: |
          CSP=$(curl -sSI -m 20 "https://mojo4k.de/kostenlos-testen.html" | grep -i '^content-security-policy' || true)
          echo "$CSP" | grep -o "connect-src[^;]*" || echo "no CSP connect-src"
          if [ -n "$CSP" ] && ! echo "$CSP" | grep -q "iptv-trial-mojo4kde.medmaar.workers.dev"; then
            echo "::error::mojo4k.de CSP blocks the trial worker"; exit 1
          fi

      - name: Panel + KV status (?debug)
        run: |
          curl -sS -m 30 "https://iptv-trial-mojo4kde.medmaar.workers.dev/?debug=1" | python3 -m json.tool || true

      - name: Worker secrets present
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -sS -m 20 "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/iptv-trial-mojo4kde/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success'), d.get('errors')); [print(' -', s['name']) for s in d.get('result') or []]"

      - name: Compare with iptvv.de worker (bindings + secrets)
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          for W in iptv-trial-mojo4kde iptv-trial-iptvvde; do
            echo "== $W settings"
            curl -sS -m 20 "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${W}/settings" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or {}; print('success:', d.get('success'), d.get('errors')); [print('  binding', b.get('type'), b.get('name')) for b in r.get('bindings',[])]; print('  observability', r.get('observability'))"
            echo "== $W secrets"
            curl -sS -m 20 "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${W}/secrets" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); [print('  -', s['name']) for s in d.get('result') or []]"
          done

      - name: Email sending DNS (Resend) for both domains
        run: |
          for D in mojo4k.de iptvv.de; do
            echo "== $D"
            for R in "resend._domainkey.$D TXT" "send.$D MX" "send.$D TXT" "_dmarc.$D TXT"; do
              set -- $R; printf '  %-28s %-4s ' "$1" "$2"; dig +short "$1" "$2" | head -2 | cut -c1-90 | tr '\n' ' '; echo
            done
          done

      - name: Recent worker errors (Workers Observability)
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          NOW=$(date +%s000); FROM=$((NOW - 6*3600*1000))
          curl -sS -m 30 -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/observability/telemetry/query" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"queryId\":\"trial-errors\",\"timeframe\":{\"from\":${FROM},\"to\":${NOW}},\"view\":\"events\",\"limit\":30,\"parameters\":{\"filters\":[{\"key\":\"\$workers.scriptName\",\"operation\":\"eq\",\"type\":\"string\",\"value\":\"iptv-trial-mojo4kde\"}]}}" \
            | python3 -c "
          import sys,json
          raw=sys.stdin.read()
          try: d=json.loads(raw)
          except Exception: print(raw[:1500]); sys.exit(0)
          print('success:', d.get('success'), d.get('errors'))
          ev=((d.get('result') or {}).get('events') or {}).get('events') or []
          for e in ev:
            src=e.get('source'); md=e.get('\$metadata',{})
            print(md.get('timestamp') or e.get('timestamp'), '|', (md.get('message') or json.dumps(src))[:300])
          "

      - name: Follow-up emails being sent (cron status per trial)
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NS: b848d7bf9dd74deca3ee42cc727ce7fa
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse
          base = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT']}/storage/kv/namespaces/{os.environ['KV_NS']}/values/"
          def get(k):
              req = urllib.request.Request(base + urllib.parse.quote(k, safe=''), headers={"Authorization": "Bearer " + os.environ["CF_TOKEN"]})
              try: return urllib.request.urlopen(req, timeout=20).read().decode()
              except Exception as e: return None
          keys = json.loads(get("__keys__") or "[]")
          now = time.time() * 1000
          print(f"{len(keys)} trials in index")
          for e in keys:
              t = json.loads(get("trial:" + e) or "{}")
              if not t: print("  (expired)", e[:2] + "***"); continue
              left = (t.get("expiry", 0) - now) / 3600000
              print(f"  {e[:2]}***@{e.split('@')[-1]:<14} created {time.strftime('%Y-%m-%d %H:%M', time.gmtime(t.get('created_at',0)/1000))}  "
                    f"expires_in={left:6.1f}h  reminder_sent={t.get('reminder_sent')}  followup_sent={t.get('followup_sent')}")
          PY
