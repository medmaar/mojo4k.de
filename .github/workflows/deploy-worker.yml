name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/worker.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker via Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-mojo4kde
        run: |
          METADATA=$(cat <<'METADATA'
          {
            "main_module": "worker.js",
            "compatibility_date": "2024-01-01",
            "keep_bindings": ["secret_text", "secret_key"],
            "bindings": [
              {
                "type": "kv_namespace",
                "name": "TRIALS",
                "namespace_id": "b848d7bf9dd74deca3ee42cc727ce7fa"
              },
              { "type": "service", "name": "FLUSH_MAPLE4K", "service": "iptv-trial-maple4k" },
              { "type": "service", "name": "FLUSH_MAPLEHD", "service": "iptv-trial-maplehd" },
              { "type": "service", "name": "FLUSH_MAPLESTREAMTV", "service": "iptv-trial-maplestreamtv" },
              { "type": "service", "name": "FLUSH_IPTVMAPLETV", "service": "iptv-trial-iptvmapletv" },
              { "type": "service", "name": "FLUSH_IPTVMOJO", "service": "iptv-trial-iptvmojo" },
              { "type": "service", "name": "FLUSH_MOJO4KTV", "service": "iptv-trial-mojo4ktv" },
              { "type": "service", "name": "FLUSH_BUYIPTVNORWAY", "service": "iptv-trial-buyiptvnorway" },
              { "type": "service", "name": "FLUSH_FLIMMERKANAL", "service": "iptv-trial-flimmerkanal" },
              { "type": "service", "name": "FLUSH_IPTVVDE", "service": "iptv-trial-iptvvde" },
              { "type": "service", "name": "FLUSH_STREAMDEUTSCHLAND", "service": "iptv-trial-streamdeutschland" },
              { "type": "service", "name": "FLUSH_MOJO4KFR", "service": "iptv-trial-mojo4kfr" },
              { "type": "service", "name": "FLUSH_STREAMBLEU", "service": "iptv-trial-streambleu" }
            ]
          }
          METADATA
          )
          RESULT=$(curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "metadata=${METADATA};type=application/json" \
            -F "worker.js=@worker/worker.js;type=application/javascript+module")
          echo "$RESULT" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          if d.get('success'): print('Deployed:', '${WORKER_NAME}')
          else: print('Error:', d.get('errors')); sys.exit(1)
          "

      - name: Enable workers.dev subdomain
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-mojo4kde
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}/subdomain" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled": true}'

      - name: Set Cron Trigger
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: iptv-trial-mojo4kde
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}/schedules" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '[{"cron": "0 * * * *"}]'
