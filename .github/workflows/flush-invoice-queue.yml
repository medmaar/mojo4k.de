name: Send night invoices (05:00 UTC)

# Invoices for orders placed from 01:00 to 04:59 UTC are saved in each site's Worker KV and emailed
# from 05:00 UTC. This calls every site's /invoice-flush at 05:00 UTC and a few times after (GitHub can
# start scheduled runs late). Safe to run any time: each call only sends invoices still waiting, once.
# Daytime orders also send anything left in the queue.

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "20 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  flush:
    runs-on: ubuntu-latest
    steps:
      - name: Send queued invoices on every site
        run: |
          fail=0
          for U in \
            https://iptv-trial-maplestreamtv.medmaar.workers.dev https://iptv-trial-maple4k.medmaar.workers.dev \
            https://iptv-trial-maplehd.medmaar.workers.dev https://iptv-trial-iptvmapletv.medmaar.workers.dev \
            https://iptv-trial-iptvmojo.medmaar.workers.dev https://iptv-trial-mojo4ktv.medmaar.workers.dev \
            https://iptv-trial-buyiptvnorway.medmaar.workers.dev https://iptv-trial-flimmerkanal.medmaar.workers.dev \
            https://iptv-trial-iptvvde.medmaar.workers.dev https://iptv-trial-mojo4kde.medmaar.workers.dev \
            https://iptv-trial-streamdeutschland.medmaar.workers.dev https://iptv-trial-mojo4kfr.medmaar.workers.dev \
            https://iptv-trial-streambleu.medmaar.workers.dev https://mojo4k.uk/api; do
            for i in 1 2 3; do
              OUT=$(curl -sS -m 60 -w ' HTTP %{http_code}' -X POST "$U/invoice-flush") && echo "$OUT" | grep -q 'HTTP 200' && break
              sleep 10
            done
            echo "$U → $OUT"
            echo "$OUT" | grep -q 'HTTP 200' || fail=1
          done
          exit $fail
