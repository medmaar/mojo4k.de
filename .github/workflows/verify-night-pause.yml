name: Verify live invoice night pause

# Read-only: downloads the code each live trial Worker is running and runs its invoice
# handler with a faked clock (00:59, 01:00, 02:30, 04:59, 05:00, 17:00 UTC) and a fake
# Resend. Never sends an email. Also shows mojo4k.uk's latest Pages deployments.

on:
  workflow_dispatch:
    inputs:
      retry_uk:
        description: "Retry mojo4k.uk's latest Pages deployment if it is stuck in the queue for 10+ minutes"
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download live Worker code
        run: |
          mkdir -p live
          for W in iptv-trial-maple4k iptv-trial-maplehd iptv-trial-maplestreamtv iptv-trial-iptvmapletv iptv-trial-iptvmojo iptv-trial-mojo4ktv iptv-trial-buyiptvnorway iptv-trial-norgesiptv iptv-trial-flimmerkanal iptv-trial-iptvvde iptv-trial-mojo4kde iptv-trial-streamdeutschland iptv-trial-mojo4kfr iptv-trial-streambleu; do
            curl -sS -m 30 "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/$W/content/v2" -H "Authorization: Bearer ${CF_TOKEN}" -o live/$W.js
            echo "$W | bytes=$(wc -c < live/$W.js) | nightPaused=$(grep -c 'function nightPaused' live/$W.js || true)"
          done
      - name: Fake-clock test on the live code
        run: node scripts/night-pause-test.mjs live
      - name: mojo4k.uk recent Pages deployments
        if: always()
        run: |
          curl -sS -m 30 "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/mojo4k-uk/deployments" -H "Authorization: Bearer ${CF_TOKEN}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success'), d.get('errors')); [print(x.get('created_on'), x.get('environment'), (x.get('deployment_trigger') or {}).get('metadata',{}).get('commit_hash','')[:7], [(s.get('name'), s.get('status')) for s in x.get('stages') or []]) for x in (d.get('result') or [])[:6]]"
      - name: Retry a stuck mojo4k.uk Pages deployment
        if: always() && inputs.retry_uk
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/mojo4k-uk/deployments"
          curl -sS -m 30 "$API" -H "Authorization: Bearer ${CF_TOKEN}" > deps.json
          ID=$(python3 -c "
          import json, datetime
          d = json.load(open('deps.json'))['result'][0]
          st = d.get('latest_stage') or {}
          age = (datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(d['created_on'].replace('Z','+00:00'))).total_seconds()
          print(d['id'] if st.get('name') == 'queued' and st.get('status') == 'active' and age > 600 else '')
          ")
          if [ -z "$ID" ]; then echo "Latest deployment is not stuck: nothing to retry."; exit 0; fi
          echo "Retrying stuck deployment $ID"
          curl -sS -m 30 -X POST "$API/$ID/retry" -H "Authorization: Bearer ${CF_TOKEN}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success'), d.get('errors')); r=d.get('result') or {}; print(r.get('id'), (r.get('latest_stage') or {}))"
